services:
  tailscale-serve:
    image: tailscale/tailscale:latest
    hostname: comfyui
    ports:
      - "8189:8188"
    
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - ./serve.json:/config/serve.json
      - tailscale-data:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    restart: unless-stopped

  comfyui:
    network_mode: "service:tailscale-serve"
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ${COMFYUI_MODELS_DIR}:/app/ComfyUI/models
      - ${COMFYUI_WORKFLOWS_DIR}:/app/ComfyUI/user/default/workflows
      - ./manager.ini:/app/ComfyUI/user/__manager/config.ini
      - custom_nodes:/app/ComfyUI/custom_nodes
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  custom_nodes:
  tailscale-data:
    driver: local